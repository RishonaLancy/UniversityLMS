apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-portal
  labels:
    app: lms-portal

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: lms-portal

  template:
    metadata:
      labels:
        app: lms-portal

    spec:
      containers:
        - name: lms-portal
          image: rishonalancy/university-lms:stable
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lms-portal-service

spec:
  type: NodePort

  selector:
    app: lms-portal

  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081
